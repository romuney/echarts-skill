<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI встречи — пересечение структур</title>
<style>
.chart-root{--ink:#303033;--muted:#8f8f93;--soft-ink:#5e5e64;--track:#efeff1;--overlap-line:#b9b9bf;--tooltip-bg:#28282c;width:100%;height:100%;min-height:300px;position:relative;overflow:hidden;box-sizing:border-box;padding:16px 20px 14px;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.chart-root *,.chart-root *::before,.chart-root *::after{box-sizing:border-box}
.chart-root .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.chart-root .chart-title{margin:0;color:var(--muted);font-size:14px;line-height:1.25;font-weight:500}
.chart-root .chart-total{margin:2px 0 0;color:var(--ink);font-size:28px;line-height:1.05;font-weight:700;letter-spacing:-.7px;display:inline-block;cursor:default}
.chart-root .chart-total small{margin-left:6px;color:var(--muted);font-size:12px;font-weight:450;letter-spacing:0}
.chart-root .info-button{width:22px;height:22px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;appearance:none;color:#a2a2a7;background:rgba(143,143,147,.1);border:0;border-radius:50%;transition:color 150ms ease,background 150ms ease}
.chart-root .info-button:hover,.chart-root .info-button.is-active{color:#5e5e64;background:rgba(143,143,147,.2)}
.chart-root .info-icon{font-family:Georgia,"Times New Roman",serif;font-size:13px;line-height:1;font-weight:700;pointer-events:none}
.chart-root .plot{position:relative;margin-top:16px}
.chart-root .overlap-band{position:absolute;top:0;bottom:24px;background:rgba(96,96,104,.06);border-left:1px dashed var(--overlap-line);border-right:1px dashed var(--overlap-line);pointer-events:none}
.chart-root .rows{position:relative;display:flex;flex-direction:column;gap:9px}
.chart-root .row{width:100%;position:relative;display:block;padding:0;cursor:pointer;appearance:none;color:inherit;font:inherit;text-align:left;background:transparent;border:0}
.chart-root .row:focus-visible{outline:none}
.chart-root .row-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--soft-ink);font-size:13px;line-height:1.2;font-weight:450;pointer-events:none;transition:opacity 150ms ease}
.chart-root .row-value{color:var(--ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chart-root .row-value span{margin-left:6px;color:var(--muted);font-weight:450}
.chart-root .track{width:100%;height:26px;position:relative;display:block;background:var(--track);border-radius:7px;pointer-events:none}
.chart-root .bar{height:26px;position:absolute;top:0;border-radius:7px;transition:opacity 150ms ease}
.chart-root .bar-total{background:#dcdce0}
.chart-root .row.is-dimmed .bar,.chart-root .row.is-dimmed .row-label{opacity:.35}
.chart-root .axis{height:24px;position:relative;margin-top:6px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none}
.chart-root .axis-tick{position:absolute;top:5px;transform:translateX(-50%);white-space:nowrap}
.chart-root .legend{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px;margin-top:10px;color:var(--muted);font-size:12px;line-height:1.3}
.chart-root .legend-item{display:inline-flex;align-items:center;gap:6px}
.chart-root .legend-dot{width:9px;height:9px;border-radius:3px}
.chart-root .legend-dot.is-overlap{background:#fff;border:1px dashed var(--overlap-line)}
.chart-root .chart-tooltip{max-width:260px;position:absolute;z-index:5;padding:8px 10px;color:#fff;font-size:12px;line-height:1.4;background:var(--tooltip-bg);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none}
.chart-root .chart-tooltip[hidden]{display:none}
.chart-root .tooltip-title{margin-bottom:2px;font-weight:600}
.chart-root .tooltip-note{margin-top:4px;color:rgba(255,255,255,.72)}
@media (max-width:520px){.chart-root .chart-total{font-size:24px}.chart-root .row-label,.chart-root .row-value{font-size:12px}}
@media (prefers-reduced-motion:reduce){.chart-root .bar,.chart-root .row-label,.chart-root .info-button{transition:none}}
</style>
</head>
<body style="margin:0;padding:0;background:#fff">
<div class="chart-root"></div>
<script>
var RULE="В сегмент входят сотрудники, состоящие в группе офлайн-четверговой на дату среза. Если сотрудник одновременно состоит в нескольких группах встреч, применяется приоритет сегментов: Четверговая Оффлайн, затем Четверговая Онлайн, затем Management Meeting.";
var data=[
{snapshot_dt:"2026-07-01",segment_id:"thursday_offline",segment_nm:"Четверговая Оффлайн",total_cnt:13,struct_key:"management",struct_nm:"Управленческая структура",struct_cnt:10,struct_color:"#f2a8b8",rule_txt:RULE},
{snapshot_dt:"2026-07-01",segment_id:"thursday_offline",segment_nm:"Четверговая Оффлайн",total_cnt:13,struct_key:"product_catalog",struct_nm:"Каталог продуктов",struct_cnt:9,struct_color:"#c9a2ee",rule_txt:RULE}
];
var state={segment_id:"thursday_offline",selected_key:null,tooltip:null};
var root=document.querySelector(".chart-root");
function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function safeColor(v){var c=String(v||"");return /^#[0-9a-fA-F]{6}$/.test(c)?c:"#d8d8dc";}
function formatPercent(v){return String(Math.round(v*10)/10).replace(".0","")+"%";}
function formatDate(v){var p=String(v||"").split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:String(v||"");}
function employeeWord(v){var n=Math.abs(Number(v)),t=n%100,o=n%10;if(t>=11&&t<=14)return "сотрудников";if(o===1)return "сотрудник";if(o>=2&&o<=4)return "сотрудника";return "сотрудников";}
function getRows(){return data.filter(function(r){return r.segment_id===state.segment_id;});}
function pct(v,t){return t?v/t*100:0;}
/* Раскладка «по Ганту»: ось 0..total_cnt.
   Первая структура прижата к левому краю, остальные — к правому,
   поэтому визуально видно и пересечение, и уникальные хвосты. */
function buildLayout(){
  var rows=getRows();
  var total=rows.length?Number(rows[0].total_cnt)||0:0;
  var sum=0;
  var items=rows.map(function(r,i){var c=Number(r.struct_cnt)||0;sum+=c;var start=i===0?0:Math.max(0,total-c);return {key:r.struct_key,name:r.struct_nm,color:safeColor(r.struct_color),count:c,start:start,end:start+c,share:total?c/total*100:0};});
  var overlap=items.length>1?Math.max(0,sum-total):total;
  var oStart=0,oEnd=total;
  items.forEach(function(it){oStart=Math.max(oStart,it.start);oEnd=Math.min(oEnd,it.end);});
  if(oEnd<=oStart){oStart=0;oEnd=0;}
  items.forEach(function(it){it.unique=Math.max(0,it.count-overlap);});
  return {total:total,items:items,overlap:overlap,overlapStart:oStart,overlapEnd:oEnd,snapshot:rows.length?rows[0].snapshot_dt:"",title:rows.length?rows[0].segment_nm:"",rule:rows.length?rows[0].rule_txt:""};
}
function getTrigger(node){var c=node;while(c&&c!==root){if(c.hasAttribute&&c.hasAttribute("data-tip"))return c;c=c.parentNode;}return null;}
function tooltipContent(L){
  if(!state.tooltip)return "";
  var k=state.tooltip.kind;
  if(k==="info")return '<div class="tooltip-title">Правило формирования встречи</div><div>'+escapeHtml(L.rule)+'</div><div class="tooltip-note">Срез на '+escapeHtml(formatDate(L.snapshot))+'</div>';
  if(k==="total")return '<div class="tooltip-title">Всего во встрече</div><div>'+L.total+" "+employeeWord(L.total)+'</div><div class="tooltip-note">Объединение всех структур сегмента</div>';
  if(k==="overlap")return '<div class="tooltip-title">Пересечение структур</div><div>'+L.overlap+" "+employeeWord(L.overlap)+" \u00b7 "+formatPercent(pct(L.overlap,L.total))+' от всех</div><div class="tooltip-note">Состоят одновременно во всех структурах</div>';
  var item=null;L.items.forEach(function(c){if(c.key===state.tooltip.key)item=c;});
  if(!item)return "";
  return '<div class="tooltip-title">'+escapeHtml(item.name)+'</div><div>'+item.count+" "+employeeWord(item.count)+" \u00b7 "+formatPercent(item.share)+" от "+L.total+'</div><div class="tooltip-note">Только в этой структуре: '+item.unique+" \u00b7 в пересечении: "+L.overlap+'</div>';
}
/* Тултип всегда внутри границ .chart-root — как во встроенном ECharts. */
function placeTooltip(el){
  var rootRect=root.getBoundingClientRect(),a=state.tooltip.rect,pad=6;
  el.style.left="0px";el.style.top="0px";
  var tip=el.getBoundingClientRect();
  var left=a.left-rootRect.left+a.width/2-tip.width/2;
  var top=a.top-rootRect.top+a.height+8;
  if(top+tip.height>rootRect.height-pad)top=a.top-rootRect.top-tip.height-8;
  left=Math.max(pad,Math.min(left,rootRect.width-tip.width-pad));
  top=Math.max(pad,Math.min(top,rootRect.height-tip.height-pad));
  el.style.left=Math.round(left)+"px";el.style.top=Math.round(top)+"px";
}
function renderTooltip(L){
  var el=root.querySelector(".chart-tooltip");
  if(!el)return;
  if(!state.tooltip){el.hidden=true;el.innerHTML="";return;}
  el.innerHTML=tooltipContent(L);el.hidden=false;placeTooltip(el);
}
function render(){
  var L=buildLayout(),total=L.total;
  var ticks=[0,L.overlapStart,L.overlapEnd,total].filter(function(v,i,a){return v>=0&&v<=total&&a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  var barsHtml=L.items.map(function(it){
    var dim=state.selected_key&&state.selected_key!==it.key;
    return '<button type="button" class="row'+(dim?" is-dimmed":"")+'" data-tip="bar" data-key="'+escapeHtml(it.key)+'" aria-pressed="'+(state.selected_key===it.key)+'">'+
      '<span class="row-label"><span>'+escapeHtml(it.name)+'</span><span class="row-value">'+it.count+"<span>только здесь "+it.unique+"</span></span></span>"+
      '<span class="track"><span class="bar" style="left:'+pct(it.start,total)+"%;width:"+pct(it.count,total)+"%;background:"+it.color+';"></span></span></button>';
  }).join("");
  var ticksHtml=ticks.map(function(v){return '<span class="axis-tick" style="left:'+pct(v,total)+'%">'+v+"</span>";}).join("");
  root.innerHTML=
  '<div class="chart-head"><div><div class="chart-title">'+escapeHtml(L.title)+'</div>'+
  '<div class="chart-total" data-tip="total">'+total+"<small>"+employeeWord(total)+" всего во встрече</small></div></div>"+
  '<button type="button" class="info-button'+(state.tooltip&&state.tooltip.kind==="info"?" is-active":"")+'" data-tip="info" aria-label="Правило формирования встречи"><span class="info-icon" aria-hidden="true">i</span></button></div>'+
  '<div class="plot">'+
  (L.overlap?'<span class="overlap-band" style="left:'+pct(L.overlapStart,total)+"%;width:"+pct(L.overlapEnd-L.overlapStart,total)+'%"></span>':"")+
  '<div class="rows">'+
  '<button type="button" class="row" data-tip="total"><span class="row-label"><span>Всего во встрече</span><span class="row-value">'+total+'</span></span><span class="track"><span class="bar bar-total" style="left:0;width:100%"></span></span></button>'+
  barsHtml+"</div>"+
  '<div class="axis">'+ticksHtml+"</div></div>"+
  '<div class="legend">'+L.items.map(function(it){return '<span class="legend-item"><span class="legend-dot" style="background:'+it.color+'"></span>'+escapeHtml(it.name)+" \u2014 "+it.count+" (только здесь "+it.unique+")</span>";}).join("")+
  '<span class="legend-item" data-tip="overlap"><span class="legend-dot is-overlap"></span>В пересечении \u2014 '+L.overlap+"</span></div>"+
  '<div class="chart-tooltip" role="tooltip" hidden></div>';
  renderTooltip(L);
}
function setTooltip(t,pinned){var r=t.getBoundingClientRect();state.tooltip={kind:t.getAttribute("data-tip"),key:t.getAttribute("data-key")||null,rect:{left:r.left,top:r.top,width:r.width,height:r.height},pinned:Boolean(pinned)};}
root.addEventListener("mouseover",function(e){var t=getTrigger(e.target);if(!t||(state.tooltip&&state.tooltip.pinned))return;setTooltip(t,false);renderTooltip(buildLayout());});
root.addEventListener("mouseout",function(e){var t=getTrigger(e.target);if(!t||(state.tooltip&&state.tooltip.pinned))return;if(e.relatedTarget&&t.contains(e.relatedTarget))return;state.tooltip=null;renderTooltip(buildLayout());});
root.addEventListener("click",function(e){
  var t=getTrigger(e.target);
  if(!t){state.tooltip=null;state.selected_key=null;render();return;}
  var kind=t.getAttribute("data-tip");
  if(kind==="bar"){var key=t.getAttribute("data-key");if(state.selected_key===key){state.selected_key=null;state.tooltip=null;}else{state.selected_key=key;setTooltip(t,true);}render();return;}
  if(state.tooltip&&state.tooltip.pinned&&state.tooltip.kind===kind){state.tooltip=null;}else{setTooltip(t,true);}
  render();
});
root.addEventListener("keydown",function(e){if(e.key==="Escape"){state.selected_key=null;state.tooltip=null;render();}});
window.addEventListener("resize",function(){state.tooltip=null;render();});
render();
</script>
<!-- FIELDS: snapshot_dt=дата среза(YYYY-MM-DD); segment_id=код сегмента; segment_nm=название сегмента; total_cnt=уникальные сотрудники встречи; struct_key=код структуры; struct_nm=название структуры; struct_cnt=сотрудники структуры в сегменте; struct_color=HEX цвет; rule_txt=правило формирования -->
</body>
</html>
